[project]
name = "click-example-testing"
version = "1.0.0"
description = "Click unit testing example"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pytest>=8.0",
]

[project.scripts]
calc = "calc:cli"

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "calc"